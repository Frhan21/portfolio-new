name: Production CI & Vercel Deploy

# Trigger HANYA saat push/merge masuk ke branch production.
# (Merge develop -> production ikut memicunya; push ke develop tidak.)
on:
  push:
    branches:
      - production

jobs:
  quality-check:
    name: CI (Prisma, Lint, Test, Build)
    runs-on: ubuntu-latest

    # Env wajib agar prisma generate & build tidak error.
    # DATABASE_CA_CERT wajib ada di GitHub Secrets
    # (lib/prisma.ts melempar error bila kosong).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRED: ${{ secrets.JWT_EXPIRED }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      # Gerbang terakhir: build wajib sukses sebelum deploy
      - name: Test Build
        run: npm run build

  deploy-production:
    name: Deploy Vercel Production
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/production'

    # Deploy LANGSUNG (remote build di Vercel), tanpa prebuilt:
    # build memakai Environment Variables milik Vercel Project.
    # --prod => tier Production.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Production
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
